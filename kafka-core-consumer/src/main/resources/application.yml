logging:
    pattern:
        console: "[Kafka Core Consumer] %clr(%d{HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:%5p}) %clr(${PID}){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n"

spring:
    application:
        name: kafka-core-consumer
    main:
        banner-mode: "off"
        log-startup-info: false
    kafka:
        consumer:
            group-id: kafka-core-consumer-group
            auto-offset-reset: earliest